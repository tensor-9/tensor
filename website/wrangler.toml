# Serve only the public website. The default deployment is a workers.dev preview.
name = "tensor-website-preview"
main = "worker.mjs"
compatibility_date = "2026-10-08"
workers_dev = true
preview_urls = false

[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = ["/", "/*/", "/*.html"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[build]
cwd = ".."
command = "python3 scripts/website.py check"
watch_dir = [
  "./public",
  "./locales",
  "./templates",
  "../.agents/skills/tensor-reverse-engineering",
]

# Optional Worker preview. The canonical site is GitHub Pages, so this
# environment attaches no custom domain.
[env.production]
name = "tensor-website"
workers_dev = true
preview_urls = false

# Production receives the already prepared and verified shared Pages artifact.
# Override the preview build so deployment does not regenerate local assets.
[env.production.build]
command = ""
