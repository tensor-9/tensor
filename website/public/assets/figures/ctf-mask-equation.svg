<text x="32" y="63" fill="#64686f">The seventh check. Cell labels are input positions, starting at 0.</text>
<rect x="32" y="87" width="696" height="43" rx="4" fill="#f7f8f8" stroke="#e6e7eb"/>
<text x="48" y="114" font-family="monospace">Encoded mask: −21, +1, −14, 0</text>
