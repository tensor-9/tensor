<rect x="340" y="202" width="388" height="148" rx="5" fill="#f7f8f8" stroke="#e6e7eb"/>
<text x="358" y="231" font-weight="600">Only one cell contributes to this sum</text>
<text x="358" y="262" font-family="monospace" fill="#5a63c9">code[21] = 55</text>
<text x="358" y="303" font-size="25" font-weight="600" fill="#5a63c9">55 → '7'</text>
<text x="358" y="333" fill="#64686f">Position 21 in the flag must contain 7.</text>
<rect x="32" y="431" width="15" height="15" rx="2" fill="#eef0fd" stroke="#5a63c9"/>
<text x="56" y="444" fill="#64686f">Selected: one cell</text>
<text x="340" y="437" fill="#64686f">26 masks give 26 equations.</text>
<text x="340" y="459" fill="#64686f">Solve them together to find the flag.</text>
