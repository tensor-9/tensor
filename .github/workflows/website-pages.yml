name: Publish Tensor website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python for website assets
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Set up Node.js for skill discovery and Worker checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install website build dependencies
        run: |
          npm ci --omit=dev --ignore-scripts
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcairo2 fonts-dejavu-core
          python3 -m pip install -r website/requirements.txt
      - name: Check shared HTML, links, assets and contributor workflows
        run: python3 scripts/website.py check
      - name: Record the published commit
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("website/_site/deployment.json").write_text(
              json.dumps({"commit": os.environ["GITHUB_SHA"]}) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # upload-pages-artifact excludes dot directories, including .well-known.
      - name: Package the website including agent discovery
        run: |
          tar --dereference --hard-dereference --directory website/_site \
            --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" \
            ./.well-known/ard.json ./.well-known/ai-catalog.json \
            ./.well-known/agent-skills/index.json > /dev/null
      - name: Upload the website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify the published revision
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -u - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          from urllib.error import URLError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen

          def open_public(url, accept=None):
              headers = {
                  "Cache-Control": "no-cache",
                  "User-Agent": "Tensor-Website-Verifier/1.0 (+https://github.com/tensor-9/tensor)",
              }
              if accept:
                  headers["Accept"] = accept
              return urlopen(Request(url, headers=headers), timeout=10)

          expected = os.environ["GITHUB_SHA"]
          base = os.environ["PAGES_URL"]
          if not base:
              sys.exit("GitHub Pages returned no published URL.")
          served = False
          for attempt in range(24):
              url = urljoin(base, "deployment.json") + "?commit=" + expected
              try:
                  with open_public(url) as response:
                      actual = json.load(response).get("commit")
                  if actual == expected:
                      served = True
                      break
                  print(f"Waiting for GitHub Pages: observed revision {actual}")
              except (URLError, TimeoutError, ValueError) as error:
                  print(f"Waiting for GitHub Pages: {error}")
              if attempt < 23:
                  time.sleep(5)
          if not served:
              sys.exit("Could not verify the published revision at " + base)
          # Pages can answer the version marker before nested paths propagate, so
          # retry the discovery resources instead of failing on first 404.
          verified = False
          for attempt in range(48):
              try:
                  with open_public(urljoin(base, ".well-known/agent-skills/index.json")) as response:
                      skill, = json.load(response)["skills"]
                  artifact_url = urljoin(base, urlsplit(skill["url"]).path.lstrip("/"))
                  with open_public(artifact_url) as response:
                      digest = "sha256:" + hashlib.sha256(response.read()).hexdigest()
                  manifests = []
                  for manifest in ("ard.json", "ai-catalog.json"):
                      with open_public(urljoin(base, ".well-known/" + manifest)) as response:
                          manifests.append(bool(json.load(response).get("entries")))
                  if digest != skill["digest"]:
                      print("Waiting for GitHub Pages: skill archive digest differs")
                  elif not all(manifests):
                      print("Waiting for GitHub Pages: empty discovery manifest")
                  else:
                      verified = True
                      break
              except (URLError, TimeoutError, ValueError) as error:
                  print(f"Waiting for GitHub Pages discovery resources at {base}: {error}")
              if attempt < 47:
                  time.sleep(5)
          if not verified:
              sys.exit("Could not verify the discovery manifests and skill archive")
          print(f"GitHub Pages serves {expected} with the discovery manifests and verified skill archive")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Published commit `{expected}` to [GitHub Pages]({base}).\n")
          PY
